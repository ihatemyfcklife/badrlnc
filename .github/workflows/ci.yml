name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.23', '1.24' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Run race detector (Linux & macOS)
        if: runner.os != 'Windows'
        run: go test -v -race ./...

      - name: Run benchmarks & verify 0-alloc guarantees
        run: go test -run=^$ -bench=. -benchmem ./...

      - name: Run fuzz smoke test
        run: |
          go test -fuzz=FuzzDecodeShard -fuzztime=15s ./...
          go test -fuzz=FuzzDecoderPushRawShard -fuzztime=15s ./...
